spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
app.storage.path=./target/test-uploads
app.ai.provider=mock
app.jwt.secret=test-secret-must-be-at-least-32-characters-long
app.jwt.expiration-seconds=3600

spring.application.name=InheritanceCompass
server.port=${PORT:8080}
management.endpoints.web.base-path=/api/actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/sangsok;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.jackson.default-property-inclusion=non_null
app.jwt.secret=${JWT_SECRET:local-development-secret-change-me-please-32chars}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
app.storage.path=${STORAGE_PATH:./data/uploads}
app.ai.provider=${AI_PROVIDER:mock}
app.ai.model=${AI_MODEL:gpt-4o}
app.ai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
springdoc.swagger-ui.path=/api/swagger-ui.html
springdoc.api-docs.path=/api/v3/api-docs

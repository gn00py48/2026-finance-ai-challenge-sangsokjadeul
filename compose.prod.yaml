# EC2 단일 인스턴스 운영용. 이미지는 GHCR에서 pull하며 서버에서 빌드하지 않는다.
# 문서 원본은 S3에 저장하므로 document 볼륨이 없다.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: [.env]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sangsok}
      POSTGRES_USER: ${POSTGRES_USER:-sangsok}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sangsok} -d ${POSTGRES_DB:-sangsok}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${BACKEND_IMAGE:?required}
    restart: unless-stopped
    labels: ["com.centurylinklabs.watchtower.enable=true"]
    env_file: [.env]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-sangsok}
      DB_USERNAME: ${POSTGRES_USER:-sangsok}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?required}
      STORAGE_TYPE: s3
      S3_BUCKET: ${S3_BUCKET:?required}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      # access token 15분. 만료되면 프론트가 refresh 쿠키로 한 번만 갱신하고 재시도한다.
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-900}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    image: ${FRONTEND_IMAGE:?required}
    restart: unless-stopped
    labels: ["com.centurylinklabs.watchtower.enable=true"]
    environment:
      DOMAIN: ${DOMAIN:?required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.prod.conf.template:/etc/nginx/templates/default.conf.template:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot
    # 갱신된 인증서를 6시간마다 다시 읽는다. certbot 컨테이너는 nginx를 reload할 수 없다.
    # 이미지 entrypoint를 그대로 exec해야 한다. 건너뛰면 templates/ 치환이 실행되지 않아
    # 베이스 이미지에 구워진 설정이 그대로 쓰이고 ACME 경로가 SPA fallback으로 응답한다.
    command: /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec /docker-entrypoint.sh nginx -g 'daemon off;'"
    depends_on:
      backend:
        condition: service_healthy

  # 12시간마다 갱신을 시도한다. 만료 30일 이내가 아니면 certbot이 아무것도 하지 않는다.
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: /bin/sh
    command: -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

  # GHCR의 :latest 태그가 갱신되면 backend, frontend를 자동으로 다시 pull하고 재기동한다.
  # dev 머지 → CI가 이미지 push → 여기서 60초 이내 감지.
  # 라벨(com.centurylinklabs.watchtower.enable=true)이 붙은 컨테이너만 대상으로 한다.
  # SSM 파라미터(.env)가 바뀔 때는 여전히 deploy.sh를 수동으로 돌려야 한다.
  # ponytail: 폴링 60초, GitHub 웹훅 트리거가 필요하면 diun+webhook로 교체.
  watchtower:
    image: containrrr/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 60 --cleanup --label-enable

volumes:
  postgres_data:
  letsencrypt:
  certbot_www:
